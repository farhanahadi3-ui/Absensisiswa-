    <script>
      // Suppress cross-origin iframe / CDN Script errors from propagating
      window.addEventListener('error', function(e) {
        if (!e || e.message === 'Script error.' || e.message === 'Script error' || !e.message) {
          if (typeof e.preventDefault === 'function') e.preventDefault();
          if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.onerror = function(msg) {
        if (msg === 'Script error.' || msg === 'Script error' || !msg) {
          return true;
        }
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (e.reason.message === 'Script error.' || String(e.reason).includes('Script error'))) {
          if (typeof e.preventDefault === 'function') e.preventDefault();
        }
      });
    </script>
